[pytest]
testpaths = tests
python_files = test_*.py

# Registered so `-m "not integration"` works and unknown-marker warnings stay
# quiet. Integration tests need a running database; they skip themselves rather
# than fail when it is unreachable.
markers =
    integration: requires a live database (run scripts/init_db.py first)
    slow: loads the InsightFace model pack; a few seconds of setup per session
    gui: constructs real widgets; needs a Qt platform plugin (skips without one)

filterwarnings =
    # insightface 1.0.1 calls skimage's deprecated transform.estimate() in
    # face_align.py. It is their code, not ours, and it fires on every single
    # face alignment -- which buries real output. Revisit when insightface
    # updates for scikit-image 2.2.
    ignore:.*`estimate` is deprecated.*:FutureWarning
